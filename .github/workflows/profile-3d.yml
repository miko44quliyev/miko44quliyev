name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-noir.json
      - name: Apply noir palette fixes
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("profile-3d-contrib/profile-noir.svg")
          if p.exists():
              s = p.read_text(encoding="utf-8")
              s = s.replace("#b07219", "#b3121b")
              s = s.replace("#f1e05a", "#e07a5f")
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated 3D graphs" || true
          git pull --rebase
          git push
