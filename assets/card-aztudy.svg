    <text x="30" y="40" class="g">microservices · learning platform</text>
    <text x="30" y="76" class="t">Aztudy</text>
    <text x="30" y="108" class="d">A learning platform split into auth, course, content, assessment</text><text x="30" y="131" class="d">and assignment services behind a Spring Cloud Gateway, with a</text><text x="30" y="154" class="d">React + Vite frontend.</text>
    <text x="30" y="208" class="s">Spring Cloud  ·  PostgreSQL  ·  Redis  ·  MinIO  ·  Docker Compose</text>
