<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Mikayil Guliyev — Software Engineer">
  <title>Mikayil Guliyev — Software Engineer</title>
  <defs>
    <clipPath id="clip">
      <rect width="1200" height="200" rx="10"/>
    </clipPath>
  </defs>
  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      fill: #e6edf3;
      letter-spacing: -0.5px;
    }
    .role {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 16px;
      font-weight: 400;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="200" fill="#0d1117"/>
    <text x="600" y="98" text-anchor="middle" class="name">Mikayil Guliyev</text>
    <text x="600" y="134" text-anchor="middle" class="role">Software Engineer · Baku, Azerbaijan</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="9.5" fill="none" stroke="#21262d" stroke-width="1"/>
</svg>
