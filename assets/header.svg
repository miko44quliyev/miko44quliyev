<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Mikayil Guliyev — Software Engineer">
  <title>Mikayil Guliyev — Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2f81f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#2f81f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="1200" height="360" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .badge-text { font-size: 12.5px; font-weight: 600; fill: #58a6ff; letter-spacing: 1.8px; }
    .name { font-size: 64px; font-weight: 800; fill: url(#titleGrad); letter-spacing: -1.2px; }
    .subtitle { font-size: 20px; font-weight: 400; fill: #8b949e; letter-spacing: -0.2px; }
    .pill-label { font-size: 12px; font-weight: 600; fill: #8b949e; letter-spacing: 0.8px; }
    .pill-val { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .pulse { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Base & Grid -->
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow1)"/>
    <rect width="1200" height="360" fill="url(#glow2)"/>

    <!-- Top subtle highlight bar -->
    <rect x="200" y="0" width="800" height="2" fill="url(#accentLine)"/>

    <!-- Status Pill -->
    <g transform="translate(80, 52)">
      <rect x="0" y="0" width="446" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="18" cy="16" r="4.5" fill="#3fb950" class="pulse"/>
      <text x="34" y="20.5" class="font-mono badge-text">SOFTWARE ENGINEER · DISTRIBUTED SYSTEMS</text>
    </g>

    <!-- Main Name & Value Proposition -->
    <text x="80" y="158" class="font-sans name">Mikayil Guliyev</text>
    <text x="80" y="198" class="font-sans subtitle">Architecting scalable backend systems, event-driven microservices, and resilient cloud infrastructure.</text>

    <!-- Bottom Metrics / Highlights Bento Row -->
    <g transform="translate(80, 244)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="330" height="68" rx="10" fill="#161b22" fill-opacity="0.85" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="16" width="3" height="36" rx="1.5" fill="#2f81f7"/>
      <text x="20" y="27" class="font-mono pill-label">ARCHITECTURE &amp; FOCUS</text>
      <text x="20" y="49" class="font-sans pill-val">Microservices · Event-Driven · Clean Code</text>

      <!-- Card 2 -->
      <rect x="355" y="0" width="330" height="68" rx="10" fill="#161b22" fill-opacity="0.85" stroke="#30363d" stroke-width="1"/>
      <rect x="355" y="16" width="3" height="36" rx="1.5" fill="#38bdf8"/>
      <text x="375" y="27" class="font-mono pill-label">EDUCATION</text>
      <text x="375" y="49" class="font-sans pill-val">B.Sc. Computer Engineering · GPA 92.8</text>

      <!-- Card 3 -->
      <rect x="710" y="0" width="330" height="68" rx="10" fill="#161b22" fill-opacity="0.85" stroke="#30363d" stroke-width="1"/>
      <rect x="710" y="16" width="3" height="36" rx="1.5" fill="#6366f1"/>
      <text x="730" y="27" class="font-mono pill-label">TRACK RECORD</text>
      <text x="730" y="49" class="font-sans pill-val">ICPC Quarter-Finalist · Ironhack (100/100)</text>
    </g>

    <!-- Decorative Right-Side Code/Architecture Graphic -->
    <g transform="translate(940, 48)" opacity="0.85">
      <rect x="0" y="0" width="180" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#f85149" opacity="0.8"/>
      <circle cx="29" cy="16" r="4" fill="#d29922" opacity="0.8"/>
      <circle cx="42" cy="16" r="4" fill="#3fb950" opacity="0.8"/>
      <line x1="0" y1="30" x2="180" y2="30" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="52" class="font-mono" font-size="11" fill="#79c0ff">service</text>
      <text x="66" y="52" class="font-mono" font-size="11" fill="#e6edf3">ClusterNode {</text>
      <text x="26" y="72" class="font-mono" font-size="11" fill="#8b949e">status:</text>
      <text x="76" y="72" class="font-mono" font-size="11" fill="#3fb950">"HEALTHY"</text>
      <text x="26" y="92" class="font-mono" font-size="11" fill="#8b949e">uptime:</text>
      <text x="76" y="92" class="font-mono" font-size="11" fill="#a5d6ff">99.99%</text>
      <text x="16" y="112" class="font-mono" font-size="11" fill="#e6edf3">}</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
