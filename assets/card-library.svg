<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="Library Management API">
  <title>Library Management API — REST API · Security</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ec4899" stop-opacity=".28"/><stop offset=".6" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="600" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    .k{font:600 12.5px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#a78bfa;letter-spacing:1.5px}
    .t{font:800 28px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#f1f5f9;letter-spacing:-.4px}
    .d{font:400 15.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#94a3b8}
    .p{fill:#0f172a;stroke:#2a3650}
    .pt{font:600 12.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#cbd5e1}
    .f{font:600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#64748b}
    .bar{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards;transform-origin:left;transform:scaleX(0)}
    @keyframes grow{to{transform:scaleX(1)}}
    .glow{animation:breathe 5s ease-in-out infinite}
    @keyframes breathe{50%{opacity:.45}}
  </style>
  <g clip-path="url(#c)">
    <rect width="600" height="280" fill="url(#bg)"/>
    <rect width="600" height="280" fill="url(#glow)" class="glow"/>
    <rect width="600" height="4" fill="url(#ac)" class="bar"/>
    <text x="32" y="52" class="k">REST API · SECURITY</text>
    <text x="32" y="92" class="t">Library Management API</text>
    <text x="32" y="132" class="d">Library domain (users, authors, books, members, loans) with</text><text x="32" y="156" class="d">role-based access, JWT authentication and Caffeine caching.</text>
    <rect x="32" y="210" width="124" height="26" rx="7" class="p"/><text x="94" y="227.5" text-anchor="middle" class="pt">Spring Security</text><rect x="164" y="210" width="36" height="26" rx="7" class="p"/><text x="181" y="227.5" text-anchor="middle" class="pt">JWT</text><rect x="207" y="210" width="36" height="26" rx="7" class="p"/><text x="225" y="227.5" text-anchor="middle" class="pt">JPA</text><rect x="251" y="210" width="80" height="26" rx="7" class="p"/><text x="291" y="227.5" text-anchor="middle" class="pt">MapStruct</text><rect x="339" y="210" width="72" height="26" rx="7" class="p"/><text x="375" y="227.5" text-anchor="middle" class="pt">Caffeine</text>
    <text x="32" y="262" class="f">Gradle · OpenAPI · layered architecture</text>
    <text x="568" y="262" text-anchor="end" class="f" fill="#a78bfa" style="fill:#a78bfa">view repo →</text>
  </g>
  <rect x=".5" y=".5" width="599" height="279" rx="17.5" fill="none" stroke="#25304a"/>
</svg>
